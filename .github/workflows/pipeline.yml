name: pipeline
on: [push]
jobs:
  warmux:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq g++ gettext make cmake autoconf-archive autoconf automake autotools-dev libxml2-dev libsdl-ttf2.0-dev libsdl-mixer1.2-dev libsdl-image1.2-dev libsdl-gfx1.2-dev libcurl4-openssl-dev libsdl1.2-dev libsdl-net1.2-dev libfribidi-dev 
          sudo apt-get install -qq libsdl2-ttf-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-gfx-dev libsdl2-dev libsdl2-net-dev
      - name: Clone warmux
        uses: actions/checkout@v6
      - name: Build warmux with CMake
        run: |
          cd trunk
          cmake .
          make -j2 VERBOSE=1
          sudo make install
