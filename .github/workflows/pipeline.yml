name: pipeline
on: [push]
jobs:
  warmux:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq g++ gettext make cmake \
          libxml2-dev libsdl-ttf2.0-dev libsdl-mixer1.2-dev \
          libsdl-image1.2-dev libsdl-gfx1.2-dev \
          libcurl4-dev libsdl-net1.2-dev libxml++2.6-dev libfribidi-dev
      - name: Clone warmux
        uses: actions/checkout@v6
      - name: Build warmux
        run: |
          cd trunk
          cmake .
          make -j2
# autoconf, automake